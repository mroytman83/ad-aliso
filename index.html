<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Ad Aliso</title>
        <meta name="description" content="A text- and ASCII-forward RPG">
        <style>
            body {
                margin: 1rem;
                background: #111;
                color: #ddd;
                font-family: system-ui, sans-serif;
            }
            #map-viewport {
                display: inline-block;
                overflow: hidden;
                margin-top: 0.75rem;
                border: 1px solid #333;
                line-height: 0;
            }
            #map-canvas {
                display: block;
                image-rendering: pixelated;
                outline: none;
            }
            #map-viewport:focus-within {
                border-color: #666;
            }
            .hint {
                font-size: 0.9rem;
                color: #999;
            }
        </style>
    </head>
    <body>
        <h1>Ad Aliso</h1>
        <p>Region sketch — <code>@</code> marks your current location.</p>
        <p id="location-status" aria-live="polite">Loading…</p>
        <p id="event-log" class="hint" aria-live="polite"></p>
        <div id="map-viewport">
            <canvas id="map-canvas" aria-label="ASCII region map viewport"></canvas>
        </div>
        <p class="hint">Click the map, then walk with arrows or WASD. Only an 80×24 window of the world is shown — the view follows you. Trees block you; crossing a border enters a new territory and may trigger an event.</p>
        <script type="module" src="scripts/main.js?v=5"></script>
    </body>
</html>
